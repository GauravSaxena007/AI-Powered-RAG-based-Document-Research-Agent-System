services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      CHROMA_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - docmind-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  docmind-data:
